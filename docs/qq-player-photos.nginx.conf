# Include inside the existing HTTPS server block after publishing player_photos
# to /var/www/cs2-player-photos. Only named public PNG portraits are served.
location ~ ^/cs2-player-photos/(hltv_[0-9]+(?:_compact)?\.png)$ {
    alias /var/www/cs2-player-photos/$1;
    auth_basic off;
    autoindex off;
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff";
    limit_except GET {
        deny all;
    }
}
